name: "Retry Failed Workflows"

on:
  workflow_run:
    workflows:
      - "Test Workflow"
    types:
      - completed

env:
  RETRY_COUNT_BRANCH: workflow-re-runs
  RUN_ID: ${{ github.event.workflow_run.id }}
  MAX_RETRIES: 5

# Branch is used for tracking retry counts so we don't infinite retry
concurrency:
  group: ${{ env.RETRY_COUNT_BRANCH }}

jobs:
  re_run:
    name: Re-run job if needed
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.RETRY_COUNT_BRANCH }}
          fetch-depth: 0
      - name: Get retrys
        id: get-retries
        run: |
          set -xe
          echo count=$(cat "${RUN_ID}" || echo 0) > "${GITHUB_OUTPUT}"
      - name: Increase re-run count
        if: ${{ fromJSON(steps.get-retries.outputs.count) < fromJSON(env.MAX_RETRIES) }}
        run: |
          set -xe
          count=$(($(cat "${RUN_ID}" || echo 0) + 1)) > "${RUN_ID}"
      - name: Cleanup retry counter if exceeded MAX_RETRIES
        if: ${{ fromJSON(steps.get-retries.outputs.count) >= fromJSON(env.MAX_RETRIES) }}
        run: |
          set -xe
          rm -vf "${RUN_ID}"
      - name: Push branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe
          gh auth setup-git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git commit --amend --no-edit
          git push -uf origin "HEAD:${RETRY_COUNT_BRANCH}"
      - name: Trigger re-run
        if: ${{ fromJSON(steps.get-retries.outputs.count) < fromJSON(env.MAX_RETRIES) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe
          gh run rerun "${RUN_ID}"

  cleanup_re_run_tracking:
    name: Cleanup branch used for tracking retry counts
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.RETRY_COUNT_BRANCH }}
          fetch-depth: 0
      - name: Remove re-run count
        run: |
          set -xe
          rm -vf "${RUN_ID}"
      - name: Push branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -xe
          gh auth setup-git
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git commit --amend --no-edit
          git push -uf origin "HEAD:${RETRY_COUNT_BRANCH}"

[package]
name = "async_openai"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "async_openai"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.22.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
git2 = "0.13"
openai = "1.0.0-alpha.14"
neo4rs = "0.7"
